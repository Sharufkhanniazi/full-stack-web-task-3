<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-secondary">
  <main class="container min-vh-90 d-flex align-items-center py-5">
    <div class="row align-items-center justify-content-center g-5 w-100">
      <section class="col-lg-6 text-center text-lg-start">
        <h1 class="display-4 fw-bold text-primary mb-2">Facebook</h1>
        <p class="fs-2 mb-0">Facebook helps you connect and share with the people in your life.</p>
      </section>

      <section class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="card border-0 shadow-sm p-3">
          <form>
            <div class="mb-3">
              <label for="email" class="visually-hidden">Email or Phone Number</label>
              <input id="email" type="text" class="form-control form-control-lg" placeholder="Email or Phone Number">
            </div>
            <div class="mb-3">
              <label for="password" class="visually-hidden">Password</label>
              <input id="password" type="password" class="form-control form-control-lg" placeholder="Password">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Log In</button>
            <a href="#" class="d-block text-center text-primary text-decoration-none my-3">Forgotten password?</a>
            <hr>
            <div class="text-center">
              <button type="button" class="btn btn-success btn-lg fw-bold">Create New Account</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer class="bg-white text-center text-secondary py-4">
    <p class="mb-2">English (US) &nbsp; Urdu &nbsp; Español &nbsp; Français &nbsp; العربية</p>
    <p class="mb-0">© 2026 Facebook</p>
  </footer>
</body>
</html>
